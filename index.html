<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GreenPulse - Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css" rel="stylesheet" />
  <style>
    body{font-family:'Heebo', sans-serif;}
    .text-primary{color:#198754!important}
    .btn-primary{background:#198754; border-color:#198754}
    #spinner{transition: opacity .5s; z-index:99999} /* SPACE THEEK */
    #spinner.hide{opacity:0; visibility:hidden}
    .header-carousel .owl-carousel-item{height:650px} /* DOT HATA DIYA */
    .header-carousel img{height:650px; object-fit:cover; width:100%}
    .service-item{box-shadow:0 0 45px rgba(0,0,0,.08); transition:.5s; border-radius:10px}
    .service-item:hover{background:#198754; color:#fff!important}
    .modal-custom{display:none; position:fixed; z-index:10000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.7)}
    .modal-content-custom{background:#fff; margin:5% auto; padding:30px; border-radius:15px; width:90%; max-width:600px; border:3px solid #198754}
  </style>
</head>
<body>

  <!-- Spinner -->
  <div id="spinner" class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
    <div class="spinner-border text-success" style="width: 3rem; height: 3rem"></div>
  </div>

  <!-- Navbar + Baqi Content yahan wala hi rahega jo maine last bheja tha -->
  <!-- ... poora navbar, carousel, services, dashboard, footer ... -->
  
  <!-- JS -->
  <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>

  <script>
    // FORCE SPINNER HIDE - YE LINE SABSE IMPORTANT HAI
    window.addEventListener('load', function() {
        setTimeout(function(){
            document.getElementById('spinner').classList.add('hide');
        }, 500);
    });

    // BAQI SARA CODE WAHI RAHEGA - AUTH, GAMES, DASHBOARD
    function openAuth(){ document.getElementById('authModal').style.display='block'; }
    function closeAuth(){ document.getElementById('authModal').style.display='none'; }
    // ... baqi functions ...
  </script>
</body>
</html>
