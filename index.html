<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreenPulse 🌱 - Neighborhood Environment Dashboard</title>
  <meta name="description" content="Community-powered environmental dashboard for cleaner, greener neighborhoods">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-[#f7f9f8]">
  <div id="root"></div>

  <script type="text/babel">
    function App() {
      const [data, setData] = React.useState({aqi: 42, noise: 58, traffic: 312, temp: 24.6});
      const [activeTab, setActiveTab] = React.useState("sensors");
      const [selected, setSelected] = React.useState(null);
      const [lastUpdate, setLastUpdate] = React.useState(new Date());

      // Live data simulation every 5 seconds
      React.useEffect(() => {
        const interval = setInterval(() => {
          setData({
            aqi: Math.floor(Math.random() * 30 + 30),
            noise: Math.floor(Math.random() * 20 + 50),
            traffic: Math.floor(Math.random() * 100 + 280),
            temp: (Math.random() * 3 + 23).toFixed(1)
          })
          setLastUpdate(new Date())
        }, 5000)
        return () => clearInterval(interval)
      }, [])

      const suggestions = [
        {id: 1, title: "Best spot for new trees", detail: "Market Crossing runs 3° hotter. Twelve shade trees would cool the whole block and reduce AQI by 15%"},
        {id: 2, title: "Quieter commute route", detail: "Take Maple Street instead of Main Rd. 12dB quieter during rush hour. Better for health."},
        {id: 3, title: "Park alert", detail: "Riverside Green has 40% more visitors on weekends. Perfect time for community events!"}
      ]

      const cards = [
        {label: "Air quality", value: data.aqi, unit: "AQI", sub: data.aqi < 50 ? "Good - cleanest week" : "Moderate", color: data.aqi < 50 ? "text-green-600" : "text-yellow-600"},
        {label: "Noise level", value: data.noise, unit: "dB", sub: data.noise < 60 ? "Calm on Maple Street" : "Busy", color: "text-gray-600"},
        {label: "Traffic flow", value: data.traffic, unit: "cars/h", sub: "Down 8% since new crossing", color: "text-green-600"},
        {label: "Temperature", value: data.temp, unit: "°C", sub: "2.1° cooler under the elms", color: "text-blue-600"},
        {label: "Park usage", value: "1.4k", unit: "visits", sub: "Riverside Green thriving", color: "text-green-600"}
      ]

      return (
        <div className="min-h-screen p-4 md:p-8">
          <div className="max-w-7xl mx-auto">
            
            {/* Header */}
            <div className="mb-8">
              <div className="flex items-center gap-3 mb-2">
                <div className="text-4xl">🌱</div>
                <h1 className="text-3xl md:text-4xl font-bold text-gray-800">GreenPulse</h1>
              </div>
              <h2 className="text-xl md:text-2xl font-semibold mb-2 text-gray-700">Good morning, Alizeh. Your street is breathing easier this week.</h2>
              <p className="text-gray-600 mb-3">Together you've shared 12,480 readings this month. Here's what your neighborhood is telling us.</p>
              <div className="flex gap-3 flex-wrap">
                <span className="bg-white px-4 py-2 rounded-full shadow-sm text-sm font-medium">📡 34 sensors online</span>
                <span className="bg-white px-4 py-2 rounded-full shadow-sm text-sm font-medium">📱 218 phones contributing</span>
                <span className="bg-white px-4 py-2 rounded-full shadow-sm text-sm text-gray-500">Last updated: {lastUpdate.toLocaleTimeString()}</span>
              </div>
            </div>

            {/* Data Cards */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 mb-8">
              {cards.map(c => (
                <div key={c.label} className="bg-white p-5 rounded-2xl shadow-md hover:shadow-xl transition cursor-pointer">
                  <p className="text-sm text-gray-500 mb-1">{c.label}</p>
                  <p className="text-3xl font-bold text-gray-800">{c.value} <span className="text-lg font-normal">{c.unit}</span></p>
                  <p className={`text-xs mt-1 font-medium ${c.color}`}>{c.sub}</p>
                </div>
              ))}
            </div>

            {/* Map + Suggestions */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div className="lg:col-span-2 bg-white p-5 rounded-2xl shadow-md">
                <h2 className="text-xl font-semibold mb-1 text-gray-800">Neighborhood live map</h2>
                <p className="text-sm text-gray-500 mb-3">34 sensors and 218 phones streaming readings right now</p>
                
                <div className="flex gap-2 mb-4 flex-wrap">
                  {["sensors","phones","demo"].map(tab => (
                    <button key={tab} onClick={() => setActiveTab(tab)}
                      className={`px-4 py-2 rounded-full text-sm font-semibold transition ${activeTab === tab ? "bg-green-500 text-white shadow" : "bg-gray-200 hover:bg-gray-300 text-gray-700"}`}>
                      {tab === "sensors" && "📡 "} {tab === "phones" && "📱 "} {tab === "demo" && "📶 "} 
                      {tab.charAt(0).toUpperCase() + tab.slice(1)}
                    </button>
                  ))}
                </div>

                <div className="bg-gradient-to-br from-green-100 to-blue-100 h-80 rounded-xl flex items-center justify-center text-gray-700 border-2 border-dashed border-green-300">
                  <div className="text-center">
                    <p className="text-4xl mb-2">🗺️</p>
                    <p className="font-semibold">Live map showing <b className="text-green-700">{activeTab}</b> data</p>
                    <p className="text-sm mt-2">
                      {activeTab === "sensors" ? "34 active sensor pins across neighborhood" : 
                       activeTab === "phones" ? "218 phone heatmap points updating live" : 
                       "Demo stream: simulated environmental data"}
                    </p>
                  </div>
                </div>
              </div>

              <div className="bg-white p-5 rounded-2xl shadow-md">
                <h2 className="text-xl font-semibold mb-1 text-gray-800">✨ What the data suggests</h2>
                <p className="text-sm text-gray-500 mb-4">Friendly nudges from your neighborhood</p>
                
                {suggestions.map(s => (
                  <div key={s.id} onClick={() => setSelected(s)}
                    className="p-3 mb-3 border-2 border-gray-100 rounded-xl hover:bg-green-50 hover:border-green-200 cursor-pointer transition">
                    <p className="font-semibold text-sm text-gray-800">💡 {s.title}</p>
                  </div>
                ))}

                {selected && (
                  <div className="mt-4 p-4 bg-green-100 rounded-xl border border-green-200">
                    <p className="text-sm text-gray-800">{selected.detail}</p>
                    <button onClick={() => setSelected(null)} className="text-xs mt-3 text-green-700 font-semibold hover:underline">Close</button>
                  </div>
                )}
              </div>
            </div>

            {/* Footer */}
            <footer className="text-center text-gray-500 text-sm mt-12">
              <p>Built with 💚 for cleaner communities by @Alizeh29116</p>
              <p className="mt-1">GreenPulse - Hear what your street is saying</p>
            </footer>
          </div>
        </div>
      )
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />)
  </script>
</body>
</html>
