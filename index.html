<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreenPulse 🌱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#f0fdf4]">
  <div id="root"></div>
  <script type="text/babel">
    function App() {
      const [data, setData] = React.useState({aqi: 42, noise: 58, traffic: 312, temp: 24.6});
      const [activeTab, setActiveTab] = React.useState("sensors");
      const [selected, setSelected] = React.useState(null);

      React.useEffect(() => {
        const interval = setInterval(() => {
          setData({
            aqi: Math.floor(Math.random() * 30 + 30),
            noise: Math.floor(Math.random() * 20 + 50),
            traffic: Math.floor(Math.random() * 100 + 280),
            temp: (Math.random() * 3 + 23).toFixed(1)
          })
        }, 5000)
        return () => clearInterval(interval)
      }, [])

      return (
        <div className="min-h-screen p-6">
          <div className="max-w-7xl mx-auto">
            <div className="flex items-center gap-3 mb-4">
              <div className="text-4xl">🌱</div>
              <h1 className="text-4xl font-bold text-green-700">GreenPulse</h1>
            </div>
            <p className="text-gray-600 mb-2">Good morning, Alizeh. Your street is breathing easier this week.</p>
            <p className="text-sm text-gray-500 mb-6">Together you've shared 12,480 readings this month</p>

            <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">
              <div className="bg-white p-4 rounded-2xl shadow">Air: <b>{data.aqi} AQI</b></div>
              <div className="bg-white p-4 rounded-2xl shadow">Noise: <b>{data.noise} dB</b></div>
              <div className="bg-white p-4 rounded-2xl shadow">Traffic: <b>{data.traffic}</b></div>
              <div className="bg-white p-4 rounded-2xl shadow">Temp: <b>{data.temp}°C</b></div>
              <div className="bg-white p-4 rounded-2xl shadow">Park: <b>1.4k</b></div>
            </div>

            <div className="grid md:grid-cols-3 gap-6">
              <div className="md:col-span-2 bg-white p-5 rounded-2xl shadow">
                <h2 className="font-bold mb-3">Neighborhood live map</h2>
                <div className="flex gap-2 mb-4">
                  <button onClick={() => setActiveTab("sensors")} className={`px-3 py-1 rounded-full ${activeTab==="sensors"?"bg-green-500 text-white":"bg-gray-200"}`}>sensors</button>
                  <button onClick={() => setActiveTab("phones")} className={`px-3 py-1 rounded-full ${activeTab==="phones"?"bg-green-500 text-white":"bg-gray-200"}`}>phones</button>
                </div>
                <div className="bg-green-100 h-72 rounded-xl flex items-center justify-center">Map: {activeTab} data</div>
              </div>
              <div className="bg-white p-5 rounded-2xl shadow">
                <h2 className="font-bold mb-3">✨ What the data suggests</h2>
                <div onClick={() => setSelected("trees")} className="p-3 mb-2 border rounded-xl cursor-pointer">Best spot for new trees</div>
                <div onClick={() => setSelected("route")} className="p-3 mb-2 border rounded-xl cursor-pointer">Quieter commute route</div>
                {selected && <div className="mt-3 p-3 bg-green-100 rounded">Detail: {selected}</div>}
              </div>
            </div>
          </div>
        </div>
      )
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />)
  </script>
</body>
</html>
